def read_json(path, default):
    try:
        return json.loads(path.read_text(encoding="utf-8"))
    except (FileNotFoundError, OSError, json.JSONDecodeError):
        return default


def write_json(path, data):
    temporary = path.with_suffix(path.suffix + ".tmp")
    temporary.write_text(json.dumps(data, indent=2, ensure_ascii=False), encoding="utf-8")
    temporary.replace(path)


def norm(value):
    value = unicodedata.normalize("NFKD", str(value)).encode("ascii", "ignore").decode()
    return " ".join(re.sub(r"[^a-z0-9]+", " ", value.lower()).split())


def number(value):
    match = re.search(r"(?:\d{1,3}(?:[.\s]\d{3})+|\d+)", str(value))
    return int(re.sub(r"\D", "", match.group(0))) if match else None


def blocked(content):
    content = content.lower()
    return any(value in content for value in ("captcha", "access denied", "verify you are human", "unusual traffic"))


def get(session, url, params, platform):
    for attempt in range(3):
        try:
            response = session.get(url, params=params, timeout=(10, 25))
            if response.status_code == 200:
                return response
            if response.status_code not in {429, 500, 502, 503, 504}:
                log.warning("%s: HTTP %s", platform, response.status_code)
                return None
        except requests.RequestException as error:
            log.warning("%s: %s", platform, error)
        time.sleep(3 * (attempt + 1))
